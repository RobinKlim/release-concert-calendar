<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- Vinyl disc -->
  <circle cx="50" cy="50" r="45" fill="#1a1a1a"/>
  <!-- Grooves -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#222" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#222" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#222" stroke-width="0.5"/>
  <!-- Center label -->
  <circle cx="50" cy="50" r="15" fill="#b45309"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="#92400e" stroke-width="0.5"/>
  <!-- Label detail -->
  <text x="50" y="48" text-anchor="middle" fill="#fff" font-size="4" font-weight="bold" font-family="Arial, sans-serif">ROBIN'S</text>
  <text x="50" y="54" text-anchor="middle" fill="#fff" font-size="3" font-family="Arial, sans-serif">MUSICBOX</text>
  <!-- Center hole -->
  <circle cx="50" cy="50" r="3" fill="#1a1a1a"/>
</svg>
