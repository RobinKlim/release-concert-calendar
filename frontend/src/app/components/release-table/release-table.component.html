<div class="relative">
  <!-- Table Header with Glow -->
  <div class="bg-amber-600 relative overflow-hidden">
    <app-ambient-glow></app-ambient-glow>
    <div class="grid grid-cols-[25%_35%_15%_15%_10%] text-white text-sm font-semibold relative">
      <div class="text-left px-3 py-2">Artist</div>
      <div class="text-left px-3 py-2">Title</div>
      <div class="text-left px-3 py-2">Type</div>
      <div class="text-left px-3 py-2">Date</div>
      <div class="text-left px-3 py-2">Days</div>
    </div>
  </div>

  <table class="w-full text-sm table-fixed">
    <colgroup>
      <col class="w-[25%]">
      <col class="w-[35%]">
      <col class="w-[15%]">
      <col class="w-[15%]">
      <col class="w-[10%]">
    </colgroup>
  <tbody>
    @if (releases.length === 0) {
      <tr>
        <td colspan="5" class="px-3 py-4 text-center text-gray-500">No releases</td>
      </tr>
    }
    @for (release of releases; track release.id; let i = $index) {
      <tr [class.bg-amber-50]="i % 2 === 1">
        <td class="px-3 py-2">{{ release.artist_name }}</td>
        <td class="px-3 py-2">{{ release.title }}</td>
        <td class="px-3 py-2">{{ release.type }}</td>
        <td class="px-3 py-2">{{ formatDate(release.date) }}</td>
        <td class="px-3 py-2">{{ daysUntilRelease(release.date) }}</td>
      </tr>
    }
  </tbody>
</table>
</div>
